<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EaseMyOffice, India's most trusted platform for virtual offices, coworking spaces, meeting rooms and business compliance. GST & company registration made simple."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://easemyoffice.in/" />

    <!-- ===== Open Graph (Facebook, WhatsApp, LinkedIn, Slack) ===== -->
    <!-- Per-page values are baked into static HTML by scripts/prerender.mjs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EaseMyOffice" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://easemyoffice.in/" />
    <meta
      property="og:title"
      content="EaseMyOffice, Virtual Offices &amp; Business Compliance in India"
    />
    <meta
      property="og:description"
      content="Premium business addresses for GST &amp; company registration, coworking spaces and meeting rooms in 250+ locations across 28 states."
    />
    <meta property="og:image" content="https://easemyoffice.in/og-image.png" />
    <meta property="og:image:secure_url" content="https://easemyoffice.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="EaseMyOffice, virtual offices and business compliance across India" />

    <!-- ===== Twitter / X Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EaseMyOffice, Virtual Offices &amp; Business Compliance in India" />
    <meta
      name="twitter:description"
      content="Premium business addresses for GST &amp; company registration, coworking spaces and meeting rooms in 250+ locations across 28 states."
    />
    <meta name="twitter:image" content="https://easemyoffice.in/og-image.png" />
    <meta name="twitter:image:alt" content="EaseMyOffice, virtual offices and business compliance across India" />

    <!-- WhatsApp shows this number when the link is shared in some clients -->
    <meta property="business:contact_data:phone_number" content="+91-8882735038" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- images are served from Unsplash, warm up the connection early -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Supabase Storage (space images) -->
    <link rel="preconnect" href="https://oijtkvkyefqfwuycibcv.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://oijtkvkyefqfwuycibcv.supabase.co" />
    <!-- easemyoffice.in images (legacy) -->
    <link rel="preconnect" href="https://easemyoffice.in" crossorigin />
    <link rel="dns-prefetch" href="https://easemyoffice.in" />
    <!-- External logo/image domains -->
    <link rel="dns-prefetch" href="https://www.rosierfoods.com" />
    <link rel="dns-prefetch" href="https://holidayszone.in" />
    <link rel="dns-prefetch" href="https://cdn.getyourguide.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>
    <title>EaseMyOffice, Virtual Offices & Business Compliance in India</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
